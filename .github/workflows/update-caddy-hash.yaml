name: Update Caddy plugin hash

on:
  schedule:
    - cron: "15 4 * * *"   
  workflow_dispatch:

jobs:
  update-caddy-hash:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: DeterminateSystems/determinate-nix-action@v3

      - name: Build (expected to fail on stale hash)
        id: build
        continue-on-error: true
        run: nix build .#nixosConfigurations.OTHERHOST.config.system.build.toplevel -L

      - name: Fix hash if build failed
        if: steps.build.outcome == 'failure'
        run: determinate-nixd fix hashes --auto-apply

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: update caddy plugin hash"
            git push
          fi
