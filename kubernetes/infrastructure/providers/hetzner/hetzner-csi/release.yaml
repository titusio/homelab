
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hetzner-csi
  namespace: kube-system
spec:
  interval: 1h
  chart:
    spec:
      chart: hcloud-csi
      version: "1.39.2"
      sourceRef:
        kind: HelmRepository
        name: hcloud
        namespace: kube-system
      interval: 1h
  values:
    env:
      HCLOUD_TOKEN:
        valueFrom:
          secretKeyRef:
            name: hetzner-csi-key
            key: token
