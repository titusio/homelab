apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 1h
  chart:
    spec:
      chart: traefik
      version: "v42.2.0"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 1h
  values:
    # Names the Hetzner Load Balancer created for the traefik Service
    # (otherwise it gets an auto-generated name in the Hetzner Console).
    service:
      annotations:
        load-balancer.hetzner.cloud/name: "traefik-${domain}"

    # Configure Network Ports and EntryPoints
    # EntryPoints are the network listeners for incoming traffic.
    ports:
      # Defines the HTTP entry point named 'web'
      web:
        port: 80
        nodePort: 30000
        # Instructs this entry point to redirect all traffic to the 'websecure' entry point
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true

      # Defines the HTTPS entry point named 'websecure'
      websecure:
        port: 443
        nodePort: 30001

    # Enables the dashboard in Secure Mode
    api:
      dashboard: true
      insecure: false

    ingressRoute:
      dashboard:
        enabled: true
        matchRule: Host(`traefik.${domain}`)
        entryPoints:
          - websecure
        middlewares:
          - name: dashboard-auth
        tls:
          secretName: traefik-tls

    # Creates a BasicAuth Middleware and Secret for the Dashboard Security
    extraObjects:
      - apiVersion: traefik.io/v1alpha1
        kind: Middleware
        metadata:
          name: dashboard-auth
        spec:
          basicAuth:
            secret: dashboard-auth-secret

    # We will route with Gateway API instead.
    ingressClass:
      enabled: false

    # Enable Gateway API Provider & Disables the KubernetesIngress provider
    # Providers tell Traefik where to find routing configuration.
    providers:
      kubernetesIngress:
        enabled: false
      kubernetesGateway:
        enabled: true

    ## Gateway Listeners
    gateway:
      listeners:
        web: # HTTP listener that matches entryPoint `web`
          port: 80
          protocol: HTTP
          namespacePolicy:
            from: All

        websecure: # HTTPS listener that matches entryPoint `websecure`
          port: 443
          protocol: HTTPS # TLS terminates inside Traefik
          namespacePolicy:
            from: All
          mode: Terminate
          # Traefik picks the certificate by SNI. Apps add their own Certificate
          # (in ns traefik) and list its secret here.
          certificateRefs:
            - kind: Secret
              name: traefik-tls # populated by cert-manager via the letsencrypt ClusterIssuer
              group: ""
            - kind: Secret
              name: matrix-tls # kubernetes/apps/matrix/certificate.yaml
              group: ""
            - kind: Secret
              name: grafana-tls # kubernetes/apps/monitoring/certificate.yaml
              group: ""

    # Enable Observability
    log:
      level: INFO
    # This enables access logs, outputting them to Traefik's standard output by default. The [Access Logs Documentation](https://doc.traefik.io/traefik/observability/access-logs/) covers formatting, filtering, and output options.
    accessLog:
      enabled: true

    # Enables Prometheus for Metrics
    metrics:
      prometheus:
        enabled: true
