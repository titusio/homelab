apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 1h
  chart:
    spec:
      chart: external-dns
      version: "1.23.0"
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns
      interval: 1h
  values:
    # Picks up Gateway API HTTPRoutes (our apps route through Traefik's
    # Gateway, not Ingress). The dashboard uses Traefik's own IngressRoute
    # CRD instead, which doesn't publish a load-balancer address in its
    # status, so its DNS record is managed by hand rather than adding a
    # hardcoded target annotation here.
    sources:
      - gateway-httproute
    policy: sync
    registry: txt
    txtOwnerId: "${domain}"
    domainFilters:
      - "${domain}"
      - "${publicDomain}"
    provider:
      name: webhook
      webhook:
        image:
          repository: docker.io/hetzner/external-dns-hetzner-webhook
          tag: v0.5.1
        env:
          - name: HETZNER_TOKEN
            valueFrom:
              secretKeyRef:
                name: hetzner-externaldns-key
                key: token
