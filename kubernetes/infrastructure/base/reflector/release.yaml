# Mirrors annotated Secrets/ConfigMaps into other namespaces. Used to share the
# shared-Postgres role credentials (ns databases) with the app that uses them,
# so only one copy lives in git. See kubernetes/README.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: reflector
  namespace: reflector
spec:
  interval: 1h
  chart:
    spec:
      chart: reflector
      version: "10.0.74"
      sourceRef:
        kind: HelmRepository
        name: emberstack
        namespace: reflector
      interval: 1h
  values:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    # Chart defaults + the two fields needed to pass the "restricted" Pod Security level.
    securityContext:
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      allowPrivilegeEscalation: false
      seccompProfile:
        type: RuntimeDefault
