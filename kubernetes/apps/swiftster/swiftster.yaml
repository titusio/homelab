---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: swiftster
  namespace: swiftster
spec:
  interval: 15m
  timeout: 5m
  chartRef:
    kind: OCIRepository
    name: swiftster
    namespace: swiftster
  values:
    controllers:
      main:
        enabled: true
        type: deployment
        containers:
          main:
            image:
              repository: ghcr.io/titusio/swiftster
              tag: 0.1.4
            env:
              MEDIA_DIR: "/music"
              PUBLIC_ORIGIN: hitdeck.de
              APP_NAME: Hitdeck
            probes:
              liveness:
                enabled: true
                type: HTTP
                path: /healthz
              readiness:
                enabled: true
                type: HTTP
                path: /readyz
                spec:
                  initialDelaySeconds: 1800 #temporary to get the music in.
    service:
      main:
        controller: main
        ports:
          http:
            port: 3000
    route:
      main:
        parentRefs:
          - name: traefik-gateway
            namespace: traefik
            sectionName: websecure
        hostnames:
          - hitdeck.de
        rules:
          - backendRefs:
              - name: swiftster
                port: 3000
    persistence:
      music:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        storageClass: hcloud-volumes
        globalMounts:
          - path: /music
