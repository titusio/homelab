apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: signal-matrix-bridge
  namespace: matrix
spec:
  selector:
    matchLabels:
      app: matrix-signal-bridge
  serviceName: "matrix-signal-bridge"
  replicas: 1
  minReadySeconds: 10
  template:
    metadata:
      labels:
        app: matrix-signal-bridge
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: signal-bridge
        image: dock.mau.dev/mautrix/signal:v0.2610.0
        ports:
        - containerPort: 29328
          name:
