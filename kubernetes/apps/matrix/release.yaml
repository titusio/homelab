apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matrix
  namespace: matrix
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: matrix
    namespace: matrix
  values:
    serverName: ${publicDomain}

    ingress:
      tlsEnabled: false

    wellKnownDelegation:
      additional:
        client: '{"org.matrix.msc2965.authentication": {"issuer": "https://maccount.${publicDomain}/", "account": "https://maccount.${publicDomain}/account/"}}'

    synapse:
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 2000m
          memory: 2Gi
      ingress:
        host: matrix.${publicDomain}
      postgres:
        host: pg-shared-rw.databases.svc.cluster.local
        port: 5432
        database: synapse
        user: synapse
        password:
          secret: synapse-db # mirrored from ns databases by Reflector
          secretKey: password
        sslMode: require

    matrixAuthenticationService:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      additional:
        oidc:
          configSecret: mas-oidc-config
          configSecretKey: config.yaml
        # passwords:
        #   config: |
        #     passwords:
        #       enabled: false
        account:
          config: |
            # Explicitly closed (MAS's own default, stated here on purpose).
            # Only covers the password/self-service signup form; SSO login
            # via the upstream OIDC provider is intentionally left open.
            account:
              password_registration_enabled: false
        smtp:
          configSecret: mas-smtp-config
          configSecretKey: config.yaml

      ingress:
        host: maccount.${publicDomain}
      postgres:
        host: pg-shared-rw.databases.svc.cluster.local
        port: 5432
        database: mas
        user: mas
        password:
          secret: mas-db # mirrored from ns databases by Reflector
          secretKey: password
        sslMode: require

    elementWeb:
      ingress:
        host: chat.${publicDomain}

    elementAdmin:
      ingress:
        host: madmin.${publicDomain}

    matrixRTC:
      enabled: false
