apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: grafana-db
  namespace: databases
spec:
  cluster:
    name: pg-shared
  name: grafana
  owner: grafana
---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: grafana-db
  namespace: databases
spec:
  cluster:
    name: pg-shared
  name: grafana
  login: true
  passwordSecret:
    name: grafana-db          # type kubernetes.io/basic-auth, keys: username, password
  databaseRoleReclaimPolicy: retain
