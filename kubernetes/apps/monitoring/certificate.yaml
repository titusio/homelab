# Served by the shared Traefik gateway (listed in its websecure certificateRefs),
# so it lives in the traefik namespace.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana-tls
  namespace: traefik
spec:
  secretName: grafana-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
  dnsNames:
    - grafana.${domain}
